services:
  - type: web
    name: tamvesta
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    domains:
      - tamvesta.web.id
      - www.tamvesta.web.id
